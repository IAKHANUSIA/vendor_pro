name: vendor_pro
description: "Vendor Pro - Newspaper & Magazine Distribution Management System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Date & Fonts
  intl: ^0.19.0
  google_fonts: ^6.1.0

  # PDF & Printing
  pdf: ^3.10.8
  printing: ^5.12.0

  # UPI, QR & Sharing
  qr_flutter: ^4.1.0
  url_launcher: ^6.2.5
  share_plus: ^8.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

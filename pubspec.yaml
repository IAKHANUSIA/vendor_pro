name: vendor_pro
description: "Vendor Pro - Newspaper & Magazine Distribution Management System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Offline Database
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.2

  # UI & Components
  intl: ^0.19.0
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.10+1
  lucide_icons: ^0.368.0

  # PDF & Printing
  pdf: ^3.10.8
  printing: ^5.12.0
  blue_thermal_printer: ^1.2.3

  # UPI, QR & Sharing
  qr_flutter: ^4.1.0
  url_launcher: ^6.2.5
  share_plus: ^8.0.3

  # Excel & File Handling
  excel: ^4.0.2
  file_picker: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  isar_generator: ^3.1.0+1
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/
    - assets/images/

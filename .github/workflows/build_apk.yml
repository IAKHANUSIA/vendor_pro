name: Build Vendor Pro Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🐦 Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Flutter Dependencies
        run: flutter pub get

      - name: 🏗️ Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: 🏷️ Prepare APK Artifact
        run: cp build/app/outputs/flutter-apk/app-release.apk VendorPro.apk

      - name: 📤 Upload Release APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vendor-Pro-Release-APK
          path: VendorPro.apk
          if-no-files-found: error

      - name: 🚀 Publish Direct GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.1
          name: "Vendor Pro v1.0.1 (Android APK)"
          make_latest: true
          body: |
            ## 📰 Vendor Pro - ન્યૂઝપેપર વિતરણ અને બિલિંગ મેનેજમેન્ટ સિસ્ટમ (Latest Release)
            - ૧૦૦% ઓફલાઇન સપોર્ટ (No Internet Required)
            - ડિજિટલ બિલ & પેમેન્ટ પહોંચ ઈમેજ કાર્ડ + WhatsApp શેર
            - લાઇન અને સ્ટાફ માસ્ટર પગાર સુધારો
            - ડેપો ખરીદી પત્રક, બોનસ પેપર્સ, UPI QR
            
            ### 📲 ડાઉનલોડ કરવા માટે:
            નીચે આપેલ **VendorPro.apk** ફાઇલ ડાઉનલોડ કરીને તમારા એન્ડ્રોઇડ ફોનમાં ઇન્સ્ટોલ કરો.
          files: VendorPro.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
